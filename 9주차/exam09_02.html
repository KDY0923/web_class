<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조건문_실습</title>
</head>
<script>
    let number = prompt("점수를 입력하세요");
    if (number >= 90) {
        alert("A학점입니다.");
    } else if (number >= 80) {
        alert("B학점입니다.");
    } else if (number >= 70) {
        alert("C학점입니다.");
    } else if (number >= 60) {
        alert("D학점입니다.");
    } else {
        alert("F학점입니다.");
    }
</script>
<body>
    <h1>성적 계산</h1>
</body>
</html>
