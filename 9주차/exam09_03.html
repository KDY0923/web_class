<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조건문(switch_case)</title>
</head>
<script>
    let number = prompt("점수를 입력하세요");
    switch (true) {
        case number >= 90:
            alert("A");
            break;
        case number >= 80:
            alert("B");
            break;
        case number >= 70:
            alert("C");
            break;
        case number >= 60:
            alert("D");
            break;
        default:
            alert("F");
    }
</script>
<body>
    <h1>성적 계산(switch ~ case문)</h1>
</body>
</html>
