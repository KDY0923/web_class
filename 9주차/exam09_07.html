<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1~100 짝수의 합 코드</title>
</head>
<body>
    <h1>JS 조건문</h1>
    <br>
    <h1>JS 반복문</h1>
    <script>
        let sum = 0;
        for(num = 1; num <= 100; num++){
            if(num % 2 == 0){
                sum = sum + num;
            }
        }
        document.write("짝수의 합: " + sum);
    </script>
</body>
</html>
