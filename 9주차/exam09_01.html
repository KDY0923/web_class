<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조건문(if)</title>
</head>
<script>
    let number = prompt("점수를 입력하세요");
    if(number % 2 === 0) {
        alert("짝수 입니다.");
    } else {
        alert("홀수 입니다.");
    }
</script>
<body>
    <h1>JS 조건문</h1>
</body>
</html>
