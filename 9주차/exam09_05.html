<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조건문+반복문</title>
</head>
<script>
    let number = prompt("점수를 입력하세요");
    switch(parseInt(number / 10)){
        case 10:
        case 9:
            alert("A학점");
            break;
        case 8:
            alert("B학점");
            break;
        case 7:
            alert("C학점");
            break;
        case 6:
            alert("D학점");
            break;
        default:
            alert("F학점");
    }
</script>
<body>
    <h1>JS 조건문</h1>
    <br>
    <h1>JS 반복문</h1>
    <script>
    let num = 1;
    while(num <= number){
        document.write( num + '<br>');
        num++;
    }
</script>
</body>
</html>
