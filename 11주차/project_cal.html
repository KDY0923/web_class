<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1 {
        text-align: center;
    }

    .disp {
        width: 225px;
        height: 40px;
        margin: 3px;
    }

    .disp {
        font-family: "Oxanium", sans-serif;
        font-size: 22pt;
        text-align: right;
    }

    input[type=button] {
        width: 50px;
        height: 50px;
        text-align: center;
        vertical-align: middle;
        margin: 5px;
        font-size: 16px;
    }

    #calc {
        width: 240px;
        margin-left: auto;
        margin-right: auto;
        font-size: 0px;
    }
</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
    $(document).ready(function () {
        $('.num').click(function () {
            let cur = $('#disp2').val();
            let n = $(this).val();
            $('#disp2').val(cur + n);
        });

        $('.op').click(function () {
            let cur = $('#disp2').val();
            let opt = $(this).val();
            let total;
            if (opt != "=") {
                $('#disp2').val(cur + opt);
            } else {
                $('#disp1').val(cur);
                // $('#disp2').val(eval(cur));
                const cal_processing = cur.trim(); //불필요한 빈칸 전처리(혹여나 split을 썼을때 ++ 넣으면 빈칸 발생)
                const cal_split = cal_processing.split(/([+\-*/])/).filter(token => token !== ""); //split을 이용해 각 기호에 따라 나눠 저장하도록 설정 + 중간 빈칸 처
                const split_length = cal_split.length //나뉘어진 split배열의 크기
                const operators = ["+", "-", "*", "/", "(", ")"]; //구분자(조절하기 위해 선언)

                for (i = 0; i < split_length; i++) {
                    if (i === 0 && operators.includes(cal_split[i])) {
                        continue;
                    }
                    if (operators.includes(cal_split[i])) { //기호일때 연산하도록 수행
                        // 문자열 -> 숫자로 변환
                        const left = Number(cal_split[i - 1]);
                        const right = Number(cal_split[i + 1]);

                        switch (cal_split[i]) {
                            case '+':
                                total = left + right;
                                break;
                            case '-':
                                total = left - right;
                                break;
                            case '*':
                                total = left * right;
                                break;
                            case '/':
                                total = left / right;
                                break;
                        }
                    }
                }
                $('#disp2').val(total);
                cur = total.toString(); //최종 결과값의 오류가 나지 않게 하기위해 cur값에 재저장.
            }
        });
    });
</script>

<body>
    <h1>계산기</h1>
    <div id="calc">
        <div>
            <input type="text" class="disp" id="disp1" readonly>
            <input type="text" class="disp" id="disp2" readonly>
        </div>
        <input type="button" class="num" value="7">
        <input type="button" class="num" value="8">
        <input type="button" class="num" value="9">
        <input type="button" class="op" value="+"><br>
        <input type="button" class="num" value="4">
        <input type="button" class="num" value="5">
        <input type="button" class="num" value="6">
        <input type="button" class="op" value="-"><br>
        <input type="button" class="num" value="1">
        <input type="button" class="num" value="2">
        <input type="button" class="num" value="3">
        <input type="button" class="op" value="*"><br>
        <input type="button" class="func" value="AC">
        <input type="button" class="num" value="0">
        <input type="button" class="op" value="/">
        <input type="button" class="op" value="=">
    </div>
</body>

</html>
